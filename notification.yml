---
- name: notiication componanet
  hosts: all
  become: true
  tasks:
    - name: create app user
      ansible.builtin.user:
        name: appuser
        system: yes
        shell: /bin/false
        create_home: no
        home: /app

    - name: copy notification file
      ansible.builtin.copy:
        src: notification.service
        dest: /etc/systemd/system/notification.service
   
    - name: install python and pip
      ansible.builtin.dnf:
        name: python3, python3-pip
        state: present

    - name: remove old app
      ansible.builtin.file:
        path: /app
        state: absent
    - name: create app directory
      ansible.builtin.file:
        path: /app
        state: directory
    - name: download app code
      ansible.builtin.unarchive:
        src: https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/notification.zip
        dest: /app
        remote_src: yes
    - name: install requirements
      ansible.builtin.shell: pip3 install -r requirements.txt
      args:
        chdir: /app
    - name: Apply permission for application folder
      ansible.builtin.file:
        path: /app
        owner: appuser
        group: appuser
        recurse: yes
        mode: 'o-rwx'
        
    - name: start notification service
       ansible.builtin.systemd:
        name: notification
        state: restarted
        enabled: yes
        daemon_reload: yes 

