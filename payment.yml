---
- name: payment component
  hosts: all
  beccome: true
  tasks:
    - name: application user
      ansible.builtin.user:
        name: appuser
        state: present
        shell: /bin/false
        create_home: false
    - name: copy payment configuration file
      ansible.builtin.copy:
        src: payment.service
        dest: /etc/systemd/system/payment.service
    - name: install python3 and pip
      ansible.builtin.dnf:
        name:
          - python3
          - python3-pip
        state: present
    - name: rempove app folder
      ansible.builtin.file:
        path: /app
        state: absent
    - name: create app folder
      ansible.builtin.file:
        path: /app
        state: directory
    - name: downlad application code
      ansible.builtin.unarchive:
        src: https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/payment.zip
        dest: /app
        remote_src: yes
    - name: Install App Dependencies
      ansible.builtin.shell: pip3 install -r requirements.txt
      args:
        chdir: /app

    - name: Apply permission for application folder
      ansible.builtin.file:
        path: /app
        owner: appuser
        group: appuser
        recurse: yes
        mode: 'o-rwx'

    - name: Start Service
      ansible.builtin.systemd_service:
        name: payment
        state: restarted
        enabled: yes
        daemon_reload: yes