---
- name: shipping componet
  hosts: all
  become: true
  tasks:
  - name: application user
    ansible.builtin.user:
      name: appuser
      state: present
      shell: /bin/false
      create_home: false
  - name: copy shipping configuration file
    ansible.builtin.copy:
      src: shipping.service
      dest: /etc/systemd/system/shipping.service
  - name: install java , maven
    ansible.builtin.dnf:
      name:
        - java-21-openjdk
        - java-21-openjdk-devel
        - maven
      state: present
  - name: install mysql client
    ansible.builtin.dnf:
      name:  mysql8.4 
      state: present
  - name: remove app folder
    ansible.builtin.file:
      path: /app
      state: absent
  - name: create app folder
    ansible.builtin.file:
      path: /app
      state: directory
  - name: downlad application code
    ansible.builtin.unarchive:
      src: https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/shipping.zip
      dest: /app
      remote_src: yes
  - name: load schema
    ansible.builtin.shell: mysql -h mysql-dev.rdevopsb89.online -u root -pRoboShop@1 < db/schema.sql
    args:
      chdir: /app
  - name: Load App User
    ansible.builtin.shell: mysql -h mysql-dev.rdevopsb89.online -u root -pRoboShop@1 < db/app-user.sql
    args:
      chdir: /app
  - name: Build Application Code
    ansible.builtin.shell: mvn clean package -DskipTests
    args:
      chdir: /app
  - name: Copy Jar file
    ansible.builtin.shell: cp target/shipping.jar /app/shipping.jar
    args:
      chdir: /app
  - name: permissions for app folder
    ansible.builtin.file:
      path: /app
      owner: appuser
      group: appuser
      RECURSIVE: yes
      mode: 'o-rwx'
  - name: start shipping service
    ansible.builtin.systemd:
      name: shipping
      state: restarted
      enabled: true
      deamon_reload: yes
      

   